name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        node:
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify reproducible bundle
        run: |
          npm run bundle
          git diff --exit-code dist/

      - name: Smoke-test packed CLI
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          tarball_path="$PWD/$tarball"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install "$tarball_path" >/dev/null
          mkdir -p "$smoke_dir/awaitlingo-home" "$smoke_dir/codex-home"
          AWAITLINGO_DRYRUN=1 AWAITLINGO_HOME="$smoke_dir/awaitlingo-home" CODEX_HOME="$smoke_dir/codex-home" npx awaitlingo version
          AWAITLINGO_DRYRUN=1 AWAITLINGO_HOME="$smoke_dir/awaitlingo-home" CODEX_HOME="$smoke_dir/codex-home" npx awaitlingo status
