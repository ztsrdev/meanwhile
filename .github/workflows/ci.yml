name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        node:
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify reproducible bundle
        if: runner.os != 'Windows'
        run: |
          npm run bundle
          cp dist/meanwhile.mjs "$RUNNER_TEMP/meanwhile-first.mjs"
          npm run bundle
          cmp "$RUNNER_TEMP/meanwhile-first.mjs" dist/meanwhile.mjs
          git diff --exit-code dist/

      - name: Smoke-test packed CLI
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          tarball_path="$PWD/$tarball"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install "$tarball_path" >/dev/null
          node -e "const pkg = require('./node_modules/meanwhile-cli/package.json'); if (pkg.name !== 'meanwhile-cli') process.exit(1)"
          mkdir -p "$smoke_dir/meanwhile-home" "$smoke_dir/codex-home"
          MEANWHILE_DRYRUN=1 MEANWHILE_HOME="$smoke_dir/meanwhile-home" CODEX_HOME="$smoke_dir/codex-home" npx meanwhile version
          MEANWHILE_DRYRUN=1 MEANWHILE_HOME="$smoke_dir/meanwhile-home" CODEX_HOME="$smoke_dir/codex-home" npx meanwhile status
